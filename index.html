<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClimateDataGuard - Khairpur, Sindh</title>
<meta name="description" content="Environmental record management for energy and waste data in Khairpur, Sindh.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
<style>
:root{--bg:#edf3f0;--ink:#12261f;--muted:#55675f;--card:#fff;--line:#d2ddd7;--accent:#0f5a46;--sun:#d99a1e;--river:#1f6f8b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0 0 .6rem;line-height:1.2}
.top{background:var(--accent);color:#fff;border-bottom:4px solid var(--sun)}
.top .in{max-width:1100px;margin:auto;padding:.9rem 1.25rem;display:flex;flex-wrap:wrap;gap:.6rem 1.5rem;align-items:center}
.top b{font:700 1.4rem Georgia,serif;margin-right:auto}
.top a{color:#dcefe4;text-decoration:none;padding:.25rem .1rem;border-bottom:2px solid transparent}
.top a.on,.top a:hover{color:#fff;border-color:#fff}
main{max-width:1100px;margin:auto;padding:1.25rem;display:grid;gap:1.25rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1.1rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.75rem}
.stat b{display:block;font:600 1.5rem Georgia,serif}.stat span{color:var(--muted);font-size:.9rem}
.flash{padding:.7rem 1rem;border-radius:8px;border:1px solid;background:#e1f2e5;border-color:#9cc9a7}
.flash.error{background:#fbe4df;border-color:#e0a698}
.split{display:grid;grid-template-columns:1.2fr 1fr;gap:1.25rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.25rem}
@media(max-width:820px){.split{grid-template-columns:1fr}}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:.4rem .9rem;text-decoration:none;display:inline-block}
button.ghost,.btn.ghost{background:transparent;color:var(--accent)}
:focus-visible{outline:3px solid #1d5c4688;outline-offset:2px}
form.add{display:grid;gap:.6rem}label{font-size:.88rem;color:var(--muted);display:grid;gap:.2rem}
input,select,textarea{font:inherit;padding:.5rem;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:.5rem;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
td.notes{white-space:normal;min-width:140px}td.act{display:flex;gap:.4rem}
.muted{color:var(--muted)}
.bar{display:grid;grid-template-columns:110px 1fr auto;gap:.5rem;align-items:center;margin:.35rem 0;font-size:.88rem}
.bt{background:#e6ece3;border-radius:6px;height:14px;overflow:hidden}.bf{height:100%}
.piewrap{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}.pie{width:130px;height:130px;border-radius:50%}
.legend div{font-size:.88rem}.legend i{display:inline-block;width:.8rem;height:.8rem;border-radius:3px;margin-right:.4rem}
.hero{background:var(--accent);color:#fff;border-radius:12px;padding:2rem 1.6rem;border-left:8px solid var(--sun)}
.hero h2{font-size:clamp(1.6rem,4vw,2.4rem);margin-bottom:.5rem}.hero p{margin:0 0 1.1rem;max-width:60ch;color:#d9ece3}
.btn.light{background:#fff;color:var(--accent);border-color:#fff}.btn.ghost.light{background:transparent;color:#fff;border-color:#ffffff99}
.calhead{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;justify-content:space-between}.calhead h3{margin:0}
.monthpick{display:flex;gap:.4rem;align-items:center}.monthpick input{width:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{font-weight:600;color:var(--muted);font-size:.85rem;text-align:center;padding:.2rem 0}
.day{min-height:84px;border:1px solid var(--line);border-radius:8px;padding:.4rem;color:var(--ink);text-decoration:none;display:flex;flex-direction:column;gap:2px;background:#fff;font-size:.78rem}
.day b{font-size:.95rem}.day.blank{border:0;background:none}.day.future{background:#f4f7f5;color:#a3b0a9}
.day.lvl1{background:#fdf3dc}.day.lvl2{background:#f9e1a6}.day.lvl3{background:#f2c866}.day.lvl4{background:#e5a92b}
a.day:hover{border-color:var(--accent)}.day.today{border:2px solid var(--accent)}.day.sel{outline:3px solid var(--river);outline-offset:1px}
.day .e{color:#7a4b00}.day .w{color:#124d66}
.dot{display:inline-block;width:.6rem;height:.6rem;border-radius:50%}.dot.e{background:var(--sun)}.dot.w{background:var(--river)}
.dots{display:none;font-style:normal;gap:3px}.legend2{margin:.8rem 0 0}
h4{font:600 1.05rem Georgia,serif;margin:1.1rem 0 .4rem}
.note{font-size:.88rem;color:var(--muted);background:#f4f7f5;border:1px dashed var(--line);border-radius:8px;padding:.6rem .8rem}
footer{max-width:1100px;margin:0 auto;padding:1.5rem 1.25rem 2rem;color:var(--muted);font-size:.88rem}
@media(max-width:640px){.day{min-height:52px;padding:.3rem}.day span{display:none}.dots{display:flex}.cal{gap:3px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="top"><div class="in"><b>ClimateDataGuard <small style="font:400 .8rem 'Segoe UI',sans-serif;opacity:.85">Khairpur, Sindh</small></b><nav id="nav" style="display:contents"></nav></div></div>
<main id="app"></main>
<footer>ClimateDataGuard, Khairpur, Sindh. Environmental record management for energy and waste.</footer>

<script>
"use strict";
const AREAS = ['Khairpur City','Gambat','Kot Diji','Faiz Ganj','Kingri','Thari Mirwah'];
const STORE = 'climatedataguard_v1';
const NAV = [['dashboard','Dashboard'],['calendar','Calendar'],['energy','Energy Records'],['waste','Waste Records'],['reports','Reports'],['about','About']];
const TYPES = {
  energy:{title:'Energy Records', group:'source', unit0:'kWh', normUnit:'kWh', big:'MWh',
    fields:[['date','Date','date'],['location','Location / Area','text'],['source','Energy source','select',['Electricity (grid)','Solar','Generator','Gas','Other']],['value','Usage','number'],['unit','Unit','select',['kWh','MWh']],['notes','Notes','textarea']]},
  waste:{title:'Waste Records', group:'type', normUnit:'kg', big:'ton',
    fields:[['date','Date','date'],['location','Location / Area','text'],['type','Waste type','select',['Plastic','Paper','Glass','Metal','Organic','E-waste','Other']],['value','Quantity','number'],['unit','Unit','select',['kg','ton']],['status','Recycling status','select',['Recycled','Pending','Not recycled']],['disposal','Disposal method','select',['Recycling centre','Composting','Reuse','Landfill','Other']],['notes','Notes','textarea']]}
};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = x => Number(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY = ymd(new Date());
const norm = (kind, r) => r.unit === TYPES[kind].big ? r.value * 1000 : r.value;
let flashMsg = null;

/* ---------- storage ---------- */
let DB = {energy:[], waste:[], nextId:1, seeded:false};
function load(){ try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && s.energy && s.waste) DB = s; } catch(e){} }
function save(){ try { localStorage.setItem(STORE, JSON.stringify(DB)); } catch(e){} }

function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function seedDemo(){
  const R = rng(42), ri = (a,b) => Math.floor(R()*(b-a+1))+a, years = 3, months = years*12, perMonth = 8;
  const seasonal = [0,.85,.85,1,1.15,1.3,1.4,1.4,1.35,1.15,1,.9,.85];
  const wT = [['Plastic',10,45],['Paper',15,60],['Glass',5,25],['Metal',5,30],['Organic',30,90],['E-waste',1,8]];
  const wN = ['Weekly collection','Sorted at source','Collected by recycling vendor','Campus clean-up drive','Routine collection'];
  const now = new Date(); DB = {energy:[], waste:[], nextId:1, seeded:true};
  for (let m = months-1; m >= 0; m--){
    const first = new Date(now.getFullYear(), now.getMonth()-m, 1);
    const maxDay = m === 0 ? now.getDate() : new Date(first.getFullYear(), first.getMonth()+1, 0).getDate();
    const p = (months-1-m)/(months-1), season = seasonal[first.getMonth()+1];
    for (let k = 0; k < perMonth; k++){
      const date = `${first.getFullYear()}-${pad(first.getMonth()+1)}-${pad(ri(1,maxDay))}`;
      const gridCut = 70 - Math.floor(25*p), solarCut = gridCut + 8 + Math.floor(25*p), genCut = solarCut + 14 - Math.floor(8*p), r = ri(1,100);
      let s;
      if (r <= gridCut) s = ['Electricity (grid)',150,450,'Normal daily consumption'];
      else if (r <= solarCut) s = ['Solar',40,160,'Solar panels at good output'];
      else if (r <= genCut) s = ['Generator',30,120,'Backup generator during power cut'];
      else s = ['Gas',20,80,'Kitchen and heating use'];
      const use = ri(s[1]*10, s[2]*10)/10 * season * (1 + .03*p*years);
      DB.energy.push({id:DB.nextId++, date, location:AREAS[ri(0,5)], source:s[0], value:Math.round(use*10)/10, unit:'kWh', notes:s[3]});
      const t = wT[ri(0,5)], rate = 45 + Math.floor(30*p), roll = ri(1,100);
      const status = roll <= rate ? 'Recycled' : roll <= rate+10 ? 'Pending' : 'Not recycled';
      const disposal = status === 'Not recycled' ? 'Landfill' : t[0] === 'Organic' ? 'Composting' : 'Recycling centre';
      const qty = ri(t[1]*10, t[2]*10)/10 * (1 + .02*p*years);
      DB.waste.push({id:DB.nextId++, date, location:AREAS[ri(0,5)], type:t[0], value:Math.round(qty*10)/10, unit:'kg', status, disposal, notes:wN[ri(0,4)]});
    }
  }
  save();
}

/* ---------- routing ---------- */
function route(){
  const h = location.hash.slice(1), i = h.indexOf('?');
  const page = (i < 0 ? h : h.slice(0,i)) || 'dashboard';
  return {page: NAV.some(n => n[0] === page) ? page : 'dashboard', q: new URLSearchParams(i < 0 ? '' : h.slice(i+1))};
}
const link = (page, o = {}) => '#' + page + (Object.keys(o).length ? '?' + new URLSearchParams(o) : '');

/* ---------- reports ---------- */
function inRange(r, from, to){ return (!from || r.date >= from) && (!to || r.date <= to); }
function report(from, to){
  const E = DB.energy.filter(r => inRange(r,from,to)), W = DB.waste.filter(r => inRange(r,from,to));
  const sum = (a, f) => a.reduce((s,r) => s + f(r), 0), by = (a, kind, key) => {
    const o = {}; a.forEach(r => o[r[key]] = (o[r[key]]||0) + norm(kind,r));
    return Object.entries(o).sort((x,y) => y[1]-x[1]);
  };
  const d = {eCount:E.length, eTotal:sum(E,r=>norm('energy',r)), wCount:W.length, wTotal:sum(W,r=>norm('waste',r))};
  d.wRec = sum(W.filter(r=>r.status==='Recycled'), r=>norm('waste',r));
  d.eBy = by(E,'energy','source'); d.wBy = by(W,'waste','type');
  d.wStatus = Object.fromEntries(by(W,'waste','status'));
  const mon = {}, yr = {};
  E.forEach(r => { const m = r.date.slice(0,7), y = r.date.slice(0,4); (mon[m] ||= [0,0])[0] += norm('energy',r); (yr[y] ||= [0,0,0])[0] += norm('energy',r); });
  W.forEach(r => { const m = r.date.slice(0,7), y = r.date.slice(0,4); (mon[m] ||= [0,0])[1] += norm('waste',r); (yr[y] ||= [0,0,0])[1] += norm('waste',r); if (r.status==='Recycled') yr[y][2] += norm('waste',r); });
  d.months = Object.entries(mon).sort((a,b) => b[0].localeCompare(a[0])).slice(0,12);
  d.years = Object.entries(yr).sort((a,b) => a[0].localeCompare(b[0]));
  return d;
}

/* ---------- view pieces ---------- */
function cards(d, label){
  const it = [[d.eCount,'energy entries'],[nf(d.eTotal)+' kWh','energy used'],[d.wCount,'waste entries'],[nf(d.wTotal)+' kg','waste recorded'],[nf(d.wRec)+' kg','waste recycled']];
  return `<p class="muted" style="margin:0">Data range: ${esc(label)}</p><section class="stats">${it.map(i=>`<div class="card stat"><b>${esc(i[0])}</b><span>${esc(i[1])}</span></div>`).join('')}</section>`;
}
function bars(rows, unit, color){
  if (!rows.length) return '<p class="muted">No data yet.</p>';
  const max = Math.max(...rows.map(r=>r[1]));
  return rows.map(([k,v]) => `<div class="bar"><span>${esc(k)}</span><div class="bt"><div class="bf" style="width:${max>0?Math.round(v/max*100):0}%;background:${color}"></div></div><span>${nf(v)} ${unit}</span></div>`).join('');
}
function pie(data){
  const colors = {'Recycled':'#2f8f5b','Pending':'#e0a21b','Not recycled':'#c0452f'}, total = Object.values(data).reduce((a,b)=>a+b,0);
  if (total <= 0) return '<p class="muted">No data yet.</p>';
  let acc = 0, stops = [], legend = '';
  for (const [k,c] of Object.entries(colors)){
    const v = data[k] || 0; if (v <= 0) continue;
    const pct = v/total*100; stops.push(`${c} ${acc}% ${acc+pct}%`); acc += pct;
    legend += `<div><i style="background:${c}"></i>${k}: ${Math.round(pct)}% (${nf(v)} kg)</div>`;
  }
  return `<div class="piewrap"><div class="pie" role="img" aria-label="Recycling status chart" style="background:conic-gradient(${stops.join(',')})"></div><div class="legend">${legend}</div></div>`;
}
const charts = d => `<section class="grid3"><div class="card"><h3>Energy by source</h3>${bars(d.eBy,'kWh','#c0862f')}</div><div class="card"><h3>Waste by type</h3>${bars(d.wBy,'kg','#2b6e9b')}</div><div class="card"><h3>Recycling status</h3>${pie(d.wStatus)}</div></section>`;

function field(f, val){
  const [k,label,type,opts] = f; let inp;
  if (type === 'select') inp = `<select name="${k}">${opts.map(o=>`<option${val===o?' selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else if (type === 'textarea') inp = `<textarea name="${k}" rows="2" maxlength="500">${esc(val)}</textarea>`;
  else if (type === 'number') inp = `<input type="number" name="${k}" step="0.01" min="0.01" required value="${esc(val)}">`;
  else if (type === 'date') inp = `<input type="date" name="${k}" required max="${TODAY}" value="${esc(val || TODAY)}">`;
  else inp = `<input type="text" name="${k}" required maxlength="100" value="${esc(val)}" list="areas" placeholder="e.g. Khairpur City">`;
  return `<label>${esc(label)}${inp}</label>`;
}

/* ---------- pages ---------- */
function pageDashboard(){
  const d = report('',''), last = k => [...DB[k]].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,5);
  let h = `<section class="hero"><h2>Environmental records for Khairpur, Sindh</h2><p>Daily energy use and waste data for six areas, with a calendar, trends and reports.</p><div><a class="btn light" href="#calendar">Open calendar</a> <a class="btn ghost light" href="#reports">View reports</a></div></section>`;
  if (!d.eCount && !d.wCount) h += `<div class="card"><p>There are no records yet. Load sample data (3 years of energy and waste records) to see how the dashboard looks, or add your own records.</p><button data-act="seed">Load sample data</button></div>`;
  h += cards(d,'all records') + charts(d) + '<section class="split">';
  for (const k of ['energy','waste']){
    const rows = last(k);
    h += `<div class="card"><h3>Recent ${TYPES[k].title}</h3>${rows.length ? rows.map(r=>`<div style="padding:.3rem 0;border-top:1px solid var(--line)">${r.date} - ${esc(r.location)} - <b>${nf(r.value)} ${r.unit}</b></div>`).join('') : '<p class="muted">No records yet.</p>'}<p style="margin-bottom:0"><a href="#${k}">View all records</a></p></div>`;
  }
  h += `</section><div class="note">Your records are saved in this browser on this device. <button class="ghost" data-act="reset">Reset sample data</button> <button class="ghost" data-act="clear">Delete all records</button></div>`;
  return h;
}

function pageRecords(kind, q){
  const cfg = TYPES[kind], editId = +q.get('edit') || 0;
  const row = editId ? (DB[kind].find(r=>r.id===editId) || {}) : (q.get('date') ? {date:q.get('date')} : {});
  const s = (q.get('q')||'').toLowerCase(), from = q.get('from')||'', to = q.get('to')||'';
  const rows = DB[kind].filter(r => inRange(r,from,to) && (!s || (r.location+' '+r.notes).toLowerCase().includes(s)))
    .sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  const shown = rows.slice(0,500);
  let h = `<h2>${cfg.title}</h2><div class="split"><section class="card"><h3>${editId?'Edit record':'Add a new record'}</h3><form class="add" id="recform" data-kind="${kind}" data-id="${editId}">`;
  h += cfg.fields.map(f => field(f, row[f[0]] ?? '')).join('');
  h += `<datalist id="areas">${AREAS.map(a=>`<option value="${a}">`).join('')}</datalist><div><button type="submit">${editId?'Update':'Save'}</button>${editId?` <a class="btn ghost" href="#${kind}">Cancel</a>`:''}</div></form></section>`;
  h += `<section class="card"><h3>Search / Filter</h3><form class="add" id="filterform" data-kind="${kind}"><label>Location or notes<input type="text" name="q" value="${esc(q.get('q')||'')}"></label><div class="two"><label>From<input type="date" name="from" value="${esc(from)}"></label><label>To<input type="date" name="to" value="${esc(to)}"></label></div><div><button type="submit">Search</button> <a class="btn ghost" href="#${kind}">Reset</a> <button type="button" class="ghost" data-act="csv" data-kind="${kind}" data-q="${esc(q.toString())}">CSV export</button></div></form></section></div>`;
  h += `<section class="card"><h3>${shown.length} record(s)${rows.length>500?' (latest 500 shown - use search or dates for older ones)':''}</h3><div class="table-wrap"><table><thead><tr>${cfg.fields.map(f=>`<th>${f[1]}</th>`).join('')}<th></th></tr></thead><tbody>`;
  if (!shown.length) h += '<tr><td colspan="9" class="muted">No records found.</td></tr>';
  for (const r of shown) h += `<tr>${cfg.fields.map(f=>`<td${f[0]==='notes'?' class="notes"':''}>${f[0]==='value'?nf(r.value):esc(r[f[0]])}</td>`).join('')}<td class="act"><a class="btn ghost" href="#${kind}?edit=${r.id}">Edit</a><button class="ghost" data-act="del" data-kind="${kind}" data-id="${r.id}">Delete</button></td></tr>`;
  return h + '</tbody></table></div></section>';
}

function pageCalendar(q){
  let ym = q.get('m') || TODAY.slice(0,7); if (!/^20\d{2}-(0[1-9]|1[0-2])$/.test(ym)) ym = TODAY.slice(0,7);
  const [Y,M] = ym.split('-').map(Number), first = new Date(Y,M-1,1), days = new Date(Y,M,0).getDate(), dow = (first.getDay()+6)%7;
  let sel = q.get('day') || ''; if (!/^\d{4}-\d{2}-\d{2}$/.test(sel) || sel.slice(0,7) !== ym || sel > TODAY) sel = TODAY.slice(0,7) === ym ? TODAY : '';
  const agg = {energy:{}, waste:{}};
  for (const k of ['energy','waste']) DB[k].filter(r=>r.date.slice(0,7)===ym).forEach(r => { const a = agg[k][r.date] ||= {c:0,t:0}; a.c++; a.t += norm(k,r); });
  const totE = Object.values(agg.energy).reduce((s,a)=>s+a.t,0), totW = Object.values(agg.waste).reduce((s,a)=>s+a.t,0);
  const maxE = Math.max(0, ...Object.values(agg.energy).map(a=>a.t));
  const active = new Set([...Object.keys(agg.energy), ...Object.keys(agg.waste)]).size;
  const ymOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`, prev = ymOf(new Date(Y,M-2,1)), next = ymOf(new Date(Y,M,1));
  let h = `<h2>Calendar</h2><section class="card"><div class="calhead"><a class="btn ghost" href="#calendar?m=${prev}">Previous</a><h3>${first.toLocaleString('en-US',{month:'long',year:'numeric'})}</h3>`;
  h += next <= TODAY.slice(0,7) ? `<a class="btn ghost" href="#calendar?m=${next}">Next</a>` : '<span></span>';
  h += `<form class="monthpick" id="monthform"><input type="month" name="m" value="${ym}" max="${TODAY.slice(0,7)}" aria-label="Choose month"><button type="submit">Go</button> <a class="btn ghost" href="#calendar">Today</a></form></div>`;
  h += `<p class="muted">This month: ${active} day(s) with records, ${nf(totE)} kWh of energy, ${nf(totW)} kg of waste. Darker days used more energy.</p><div class="cal">`;
  h += ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(n=>`<div class="dow">${n}</div>`).join('') + '<div class="day blank"></div>'.repeat(dow);
  for (let d = 1; d <= days; d++){
    const date = `${ym}-${pad(d)}`;
    if (date > TODAY){ h += `<div class="day future"><b>${d}</b></div>`; continue; }
    const e = agg.energy[date], w = agg.waste[date], lvl = (e||w) ? Math.max(1, (maxE>0 && e) ? Math.ceil(e.t/maxE*4) : 1) : 0;
    h += `<a class="day lvl${lvl}${date===TODAY?' today':''}${date===sel?' sel':''}" href="#calendar?m=${ym}&day=${date}"><b>${d}</b>${e?`<span class="e">${Math.round(e.t)} kWh</span>`:''}${w?`<span class="w">${Math.round(w.t)} kg</span>`:''}<em class="dots">${e?'<i class="dot e"></i>':''}${w?'<i class="dot w"></i>':''}</em></a>`;
  }
  h += '</div><p class="muted legend2"><i class="dot e"></i> Energy (kWh) <i class="dot w"></i> Waste (kg)</p></section>';
  if (!sel) return h + '<section class="card"><p class="muted">Select a day to see its records.</p></section>';
  h += `<section class="card" id="day"><h3>${new Date(sel+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h3>`;
  for (const k of ['energy','waste']){
    const cfg = TYPES[k], rows = DB[k].filter(r=>r.date===sel).sort((a,b)=>b.id-a.id);
    h += `<h4>${cfg.title} <span class="muted">(${rows.length})</span></h4>`;
    if (!rows.length) h += '<p class="muted">No records on this day.</p>';
    else h += `<div class="table-wrap"><table><thead><tr><th>Location</th><th>${k==='energy'?'Energy source':'Waste type'}</th><th>Amount</th><th>Notes</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.location)}</td><td>${esc(r[cfg.group])}</td><td>${nf(r.value)} ${r.unit}</td><td class="notes">${esc(r.notes)}</td></tr>`).join('')}</tbody></table></div>`;
    h += `<p><a class="btn" href="#${k}?date=${sel}">Add ${k} record for this day</a></p>`;
  }
  return h + '</section>';
}

function pageReports(q){
  const from = q.get('from')||'', to = q.get('to')||'', d = report(from,to);
  let h = `<h2>Reports / Analytics</h2><form class="card add" id="reportform"><div class="two"><label>From<input type="date" name="from" value="${esc(from)}"></label><label>To<input type="date" name="to" value="${esc(to)}"></label></div><div><button type="submit">Generate report</button> <a class="btn ghost" href="#reports">Reset</a></div></form>`;
  h += cards(d, `from ${from||'the beginning'} to ${to||'today'}`) + charts(d);
  h += `<section class="card"><h3>Yearly totals</h3><div class="table-wrap"><table><thead><tr><th>Year</th><th>Energy (kWh)</th><th>Waste (kg)</th><th>Recycled (kg)</th><th>Recycling rate</th></tr></thead><tbody>`;
  h += d.years.length ? d.years.map(([y,v])=>`<tr><td>${y}</td><td>${nf(v[0])}</td><td>${nf(v[1])}</td><td>${nf(v[2])}</td><td>${v[1]>0?Math.round(v[2]/v[1]*100):0}%</td></tr>`).join('') : '<tr><td colspan="5" class="muted">No data in this range.</td></tr>';
  h += `</tbody></table></div></section><section class="card"><h3>Monthly totals</h3><div class="table-wrap"><table><thead><tr><th>Month</th><th>Energy (kWh)</th><th>Waste (kg)</th></tr></thead><tbody>`;
  h += d.months.length ? d.months.map(([m,v])=>`<tr><td>${m}</td><td>${nf(v[0])}</td><td>${nf(v[1])}</td></tr>`).join('') : '<tr><td colspan="3" class="muted">No data in this range.</td></tr>';
  return h + '</tbody></table></div><p class="muted" style="margin-bottom:0">Totals are converted to kWh (MWh x 1000) and kg (ton x 1000).</p></section>';
}

const pageAbout = () => `<h2>About ClimateDataGuard</h2><section class="card">
<h3>Problem</h3><p>Khairpur, in Sindh, has very hot summers, so energy use and waste management matter a lot for the local environment. But this information is often kept on paper or in scattered files, which makes it hard to see the real impact and to act on it.</p>
<h3>Solution</h3><p>ClimateDataGuard is a digital environmental record-management website for Khairpur, Sindh. It stores energy-consumption and waste-management data, shows summaries on a dashboard, and supports a daily calendar, search, edit, delete, date-range reports and CSV export.</p>
<h3>Technology</h3><p>HTML, CSS and JavaScript. Records are saved in the browser, so the site runs from a simple link with no server. A PHP and MySQL version is also available for use with XAMPP.</p>
<h3>Expected impact</h3><p>Easier monitoring of energy and waste data, which encourages saving energy, recycling more waste and raising environmental awareness.</p></section>`;

/* ---------- render ---------- */
function render(){
  const {page, q} = route();
  $('#nav').innerHTML = NAV.map(([k,v]) => `<a href="#${k}" class="${page===k?'on':''}">${v}</a>`).join('');
  let h = flashMsg ? `<div class="flash ${flashMsg[0]==='error'?'error':''}" role="status">${esc(flashMsg[1])}</div>` : ''; flashMsg = null;
  h += page==='dashboard' ? pageDashboard() : page==='calendar' ? pageCalendar(q) : page==='reports' ? pageReports(q) : page==='about' ? pageAbout() : pageRecords(page,q);
  $('#app').innerHTML = h;
  document.title = (NAV.find(n=>n[0]===page)[1]) + ' - ClimateDataGuard';
}
function go(hash, msg, type){ if (msg) flashMsg = [type||'success', msg]; if (location.hash === hash) render(); else location.hash = hash; }
window.addEventListener('hashchange', () => { render(); window.scrollTo(0,0); });

/* ---------- actions ---------- */
function validate(kind, fd){
  const errs = [], d = {};
  for (const [k,label,type,opts] of TYPES[kind].fields){
    const v = String(fd.get(k) ?? '').trim();
    if (type==='date' && (!/^\d{4}-\d{2}-\d{2}$/.test(v) || isNaN(new Date(v)))) errs.push(`${label}: please choose a valid date.`);
    else if (type==='date' && v > TODAY) errs.push(`${label} cannot be in the future.`);
    if (type==='text' && !v) errs.push(`${label} is required.`);
    if (type==='text' && v.length > 100) errs.push(`${label} is too long (max 100 characters).`);
    if (type==='number' && !(parseFloat(v) > 0)) errs.push(`${label} must be a number greater than 0.`);
    if (type==='number' && parseFloat(v) > 1e9) errs.push(`${label} is too large.`);
    if (type==='select' && !opts.includes(v)) errs.push(`${label}: please choose an option.`);
    if (type==='textarea' && v.length > 500) errs.push(`${label} is too long (max 500 characters).`);
    d[k] = type==='number' ? parseFloat(v) : v;
  }
  return [d, errs];
}
function csv(kind, qs){
  const q = new URLSearchParams(qs), cfg = TYPES[kind], s = (q.get('q')||'').toLowerCase();
  const rows = DB[kind].filter(r => inRange(r,q.get('from'),q.get('to')) && (!s || (r.location+' '+r.notes).toLowerCase().includes(s))).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  const cell = v => '"' + String(v ?? '').replace(/"/g,'""') + '"';
  const lines = [['ID',...cfg.fields.map(f=>f[1])].map(cell).join(',')];
  rows.forEach(r => lines.push([r.id,...cfg.fields.map(f=>r[f[0]])].map(cell).join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\uFEFF'+lines.join('\r\n')], {type:'text/csv;charset=utf-8'}));
  a.download = `climatedataguard_${kind}.csv`; a.click(); URL.revokeObjectURL(a.href);
}

document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.id === 'recform'){
    const kind = f.dataset.kind, id = +f.dataset.id, [d, errs] = validate(kind, new FormData(f));
    if (errs.length){ flashMsg = ['error', errs.join(' ')]; render(); window.scrollTo(0,0); return; }
    if (id){ const i = DB[kind].findIndex(r=>r.id===id); if (i>=0) DB[kind][i] = {...d, id}; }
    else DB[kind].push({...d, id:DB.nextId++});
    save(); go('#'+kind, id ? 'Record updated.' : 'Record saved.');
  } else if (f.id === 'filterform' || f.id === 'reportform'){
    const o = {}; new FormData(f).forEach((v,k) => { if (String(v).trim()) o[k] = String(v).trim(); });
    go(link(f.id==='reportform' ? 'reports' : f.dataset.kind, o));
  } else if (f.id === 'monthform'){
    go(link('calendar', {m:new FormData(f).get('m')}));
  }
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'csv') csv(b.dataset.kind, b.dataset.q);
  else if (a === 'del'){ if (!confirm('Delete this record?')) return; DB[b.dataset.kind] = DB[b.dataset.kind].filter(r=>r.id!==+b.dataset.id); save(); go(location.hash||'#'+b.dataset.kind, 'Record deleted.'); }
  else if (a === 'seed') { seedDemo(); go('#dashboard', 'Sample data loaded: 3 years of energy and waste records.'); }
  else if (a === 'reset'){ if (!confirm('This deletes ALL current records and loads fresh sample data. Continue?')) return; seedDemo(); go('#dashboard', 'Sample data reloaded.'); }
  else if (a === 'clear'){ if (!confirm('Delete ALL records from this browser?')) return; DB = {energy:[], waste:[], nextId:1, seeded:true}; save(); go('#dashboard', 'All records deleted.'); }
});

/* ---------- start ---------- */
load();
if (!DB.seeded && !DB.energy.length && !DB.waste.length) seedDemo();
render();
</script>
</body>
</html>
